# Compliance client agent -- LAN ingress. Managed copy lives in the service tree
# at nginx/compliance-agent.conf; /etc/nginx/sites-available holds a deployed
# copy. Edit the tree copy and reinstall; do not diverge them.
#
# WHY ITS OWN PORT AND NOT /complianceAgent/
# Open WebUI 0.10.2 has no base-path setting. Its built SPA references /static/,
# /_app/ and /api/ as ROOT-absolute paths, and after login its client-side
# router rewrites the address bar to "/". Under a subpath the first load 404s
# against the devportal and navigation escapes the prefix. So it gets a port,
# and http://<host>/complianceAgent in the devportal block redirects here.

# Distinct variable name: the devportal file already defines $connection_upgrade
# in the same http context, and two maps cannot share one variable.
map $http_upgrade $compliance_connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  # Deliberately NOT "listen 10.48.50.117:8443": that address is DHCP-assigned
  # ("dynamic noprefixroute"), and nginx fails to start if it tries to bind an
  # address the interface does not hold yet at boot. ufw does the scoping.
  listen 8443 ssl http2;
  server_name _;

  ssl_certificate     /etc/ssl/compliance-agent/compliance-agent.crt;
  ssl_certificate_key /etc/ssl/compliance-agent/compliance-agent.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_cache   shared:ComplianceTLS:10m;
  ssl_session_timeout 1d;

  client_max_body_size 200m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Robots-Tag "noindex, nofollow" always;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;

    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $compliance_connection_upgrade;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # A codex job may hold an SSE stream open for the full 30-minute
    # codex.timeout_seconds with no bytes flowing. A shorter timeout kills live
    # jobs mid-run, which looks to the client like a hang.
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_buffering    off;
  }
}
