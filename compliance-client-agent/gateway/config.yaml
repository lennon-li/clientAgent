# Server-owned configuration for the compliance client agent gateway.
#
# NOTHING here may be overridden by an API request body. Clients send only
# {chat_id, user_id, message, messages?}.
#
# RELOCATABILITY
# --------------
# Every path below is either relative to the service tree root or overridable by
# an environment variable. The tree root is resolved as:
#   1. $COMPLIANCE_AGENT_HOME, if set
#   2. otherwise the parent of the directory containing this file
# So the whole directory can be `cp -a`'d to /srv/compliance-client-agent and
# started under a different UID with no edits. See docs/RELOCATION.md.

gateway:
  # HARD REQUIREMENT: loopback only. Never 0.0.0.0. Enforced in app/config.py.
  host: "127.0.0.1"          # env override: COMPLIANCE_GATEWAY_HOST
  port: 8642                 # env override: COMPLIANCE_GATEWAY_PORT
  # Paths relative to the tree root.
  state_dir: "state"
  db_path: "state/gateway/gateway.sqlite3"
  worktrees_dir: "state/worktrees"
  log_dir: "logs"

project:
  name: "compliance"

  # RUNTIME REPOSITORY: the service-owned bare clone. Every client branch and
  # worktree is created from here. Nothing in the running system reads or
  # writes the maintainer's checkout.
  repo_path: "state/repo.git"

  # BOOTSTRAP ONLY. Read exactly once, by scripts/bootstrap_repo.sh, to create
  # state/repo.git via `git clone --no-hardlinks --bare`. The running gateway
  # never opens this path; tests assert that.
  # env override: COMPLIANCE_SOURCE_REPO
  source_repo: "/home/yeli/shiny/compliance"

  # Detected at runtime from the service clone's HEAD. This is only a
  # last-resort fallback if detection fails entirely.
  default_branch_fallback: "main"

  branch_prefix: "client/compliance"
  test_command: "Rscript -e 'devtools::test()'"

  # LOCAL project memory, inside the service tree. Compliance has no remote
  # project memory: it is deliberately NOT kept in the synced obsidian vault.
  # Relative to the tree root, so it relocates with everything else and is
  # bindable into the jail (/home/yeli/obsidian is in jail.NEVER_BIND, so the
  # old vault path was unreadable to the agent it was written for).
  # env override: COMPLIANCE_MEMORY_INDEX
  memory_dir: "memory"
  memory_index: "memory/MEMORY_INDEX.md"
  agents_md: "AGENTS.md"

  # Gitignored directories that hold employee compliance data or build output.
  # These are NOT a blocking access-control boundary any more -- the client is
  # internal and already authorized for this data. They are kept as
  # defence-in-depth: a fresh worktree should not contain them, and a test
  # asserts that. Their absence is reported, never enforced by refusing work.
  excluded_paths:
    - "backup"
    - "output"
    - "library"

codex:
  # Provider is server-owned. The default is GitHub Copilot CLI; Codex remains
  # available for a deliberate rollback with COMPLIANCE_AGENT_PROVIDER=codex.
  provider: "copilot"
  # env override: COMPLIANCE_COPILOT_BIN (or COMPLIANCE_CODEX_BIN for Codex).
  # Bare name is resolved against `path`.
  binary: "copilot"
  # Dedicated CODEX_HOME, relative to the tree root. Deliberately NOT
  # ~/.codex, which sets approval_policy="never" +
  # sandbox_mode="danger-full-access" globally.
  codex_home: "state/codex_home"
  sandbox: "workspace-write"
  model: "claude-sonnet-5"
  timeout_seconds: 1800
  # Minimal PATH handed to the codex child process, not the caller's environment.
  # env override: COMPLIANCE_COPILOT_PATH (or COMPLIANCE_CODEX_PATH for Codex)
  path: "/home/yeli/.npm-global/bin:/home/yeli/.local/bin:/usr/local/bin:/usr/bin:/bin"

# Bubblewrap containment. Every codex invocation runs inside an unprivileged
# user namespace: writes are confined to the worktree, the service clone and
# CODEX_HOME; nothing else under /home is visible; and no_new_privs makes sudo
# inert. See app/jail.py and docs, "What the jail does not contain".
jail:
  enabled: true
  # Refuse to run rather than silently dropping containment if bwrap is
  # missing. Set false only for a deliberate, documented local debug session.
  required: true
  # Read-only binds the toolchain needs. The R user library lives under the
  # maintainer's home and is NOT in the worktree (library/ is gitignored), so
  # without this devtools::test() silently falls back to older system packages
  # and fails on version constraints.
  extra_ro:
    - "/home/yeli/R/x86_64-pc-linux-gnu-library/4.6"
    # Copilot's npm loader resolves its platform binary below this package.
    # Bind only the package tree, not the whole npm prefix.
    - "/home/yeli/.npm-global/lib/node_modules/@github/copilot"
    # Local project memory, read-only. The agent is told to read this first.
    - "memory"
  # Environment set inside the jail. HOME is a throwaway tmpfs, so R must be
  # told where the user library is.
  setenv:
    R_LIBS_USER: "/home/yeli/R/x86_64-pc-linux-gnu-library/4.6"

limits:
  max_message_chars: 20000
  max_history_messages: 40

# Preview deployment is deliberately separate from the live app. The
# maintainer has provisioned this directory under the existing Shiny site root;
# the gateway never targets /srv/shiny-server/compliance.
preview:
  enabled: true
  target_dir: "/srv/shiny-server/test/compliance"
  url: "http://10.48.50.117/shiny/test/compliance/"
