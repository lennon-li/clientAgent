[project]
name = "clientagent"
version = "0.1.0"
description = "Governed, project-specific AI-agent framework"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clientagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
